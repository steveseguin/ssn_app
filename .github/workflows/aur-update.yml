name: Update AUR Package

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6am UTC
  workflow_dispatch:     # Manual trigger

jobs:
  update-aur:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pacman -Syu --noconfirm base-devel git openssh curl jq

      - name: Get release version
        id: version
        run: |
          # Always fetch latest from social_stream releases
          VERSION=$(curl -s https://api.github.com/repos/steveseguin/social_stream/releases/latest | jq -r .tag_name)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Latest release version: $VERSION"
          
          # Get current AUR version
          CURRENT=$(grep -Po '^pkgver=\K.*' aur/PKGBUILD)
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "Current AUR version: $CURRENT"
          
          if [ "$VERSION" = "$CURRENT" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "AUR is already up to date"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Update needed: $CURRENT -> $VERSION"
          fi

      - name: Update PKGBUILD
        if: steps.version.outputs.skip != 'true'
        working-directory: aur
        run: |
          VERSION=${{ steps.version.outputs.version }}
          echo "Updating PKGBUILD to version $VERSION"
          
          # Update pkgver
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          
          # Download and compute checksum
          URL="https://github.com/steveseguin/social_stream/releases/download/${VERSION}/socialstreamninja_linux_v${VERSION}_x86_64.AppImage"
          echo "Downloading AppImage from: $URL"
          CHECKSUM=$(curl -sL "$URL" | sha256sum | cut -d' ' -f1)
          echo "Computed SHA256: $CHECKSUM"
          
          # Update sha256sums (first entry)
          sed -i "s/^sha256sums=('[^']*'/sha256sums=('$CHECKSUM'/" PKGBUILD
          
          # Create non-root user for makepkg (required by makepkg)
          useradd -m builder
          chown -R builder:builder .
          
          # Regenerate .SRCINFO
          su builder -c "makepkg --printsrcinfo > .SRCINFO"
          
          echo "PKGBUILD updated successfully"
          cat PKGBUILD

      - name: Push to AUR
        if: steps.version.outputs.skip != 'true'
        working-directory: aur
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          # Setup SSH for AUR
          mkdir -p ~/.ssh
          echo "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          cat >> ~/.ssh/config << 'EOF'
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            User aur
            StrictHostKeyChecking accept-new
          EOF
          
          # Configure git
          git config --global user.email "steve@seguin.email"
          git config --global user.name "Steve Seguin"
          
          # Clone AUR repo
          git clone aur@aur.archlinux.org:socialstreamninja.git ../aur-push
          
          # Copy updated files
          cp PKGBUILD .SRCINFO socialstreamninja.desktop ../aur-push/
          
          # Commit and push
          cd ../aur-push
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit - AUR is already up to date"
          else
            git commit -m "Update to ${{ steps.version.outputs.version }}"
            git push
            echo "Successfully pushed update to AUR"
          fi
