<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background-color: #11161c;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            padding: 18px;
            box-sizing: border-box;
        }
        .dialog-container {
            width: 100%;
            height: 100%;
        }
        .dialog {
            background-color: #18202a;
            color: #f4f4f4;
            padding: 24px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        h2 {
            margin: 0;
            font-size: 24px;
            line-height: 1.3;
        }
        p {
            margin: 0;
            line-height: 1.5;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            background: rgba(0, 0, 0, 0.45);
            color: #f4f4f4;
            border-color: rgba(255, 255, 255, 0.25);
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #4da3ff;
            box-shadow: 0 0 0 2px rgba(77, 163, 255, 0.35);
        }
        input.error {
            border-color: #ff6b6b;
            box-shadow: 0 0 0 2px rgba(255, 107, 107, 0.35);
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        button.secondary {
            background-color: rgba(255, 255, 255, 0.15);
            color: #f4f4f4;
        }
        button.secondary:hover {
            background-color: rgba(255, 255, 255, 0.25);
        }
        .checkbox-container {
            display: none;
            align-items: center;
            gap: 10px;
            font-size: 16px;
        }
        .checkbox-container input[type="checkbox"] {
            width: auto;
            margin: 0;
        }
        .checkbox-container label {
            vertical-align: middle;
        }
        .button-row {
            margin-top: auto;
            display: flex;
            gap: 10px;
            padding-top: 12px;
        }
        .error-message {
            display: none;
            margin: 5px 0 0;
            color: #ff6b6b;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="dialog-container">
        <div class="dialog">
            <h2 id="title"></h2>
            <p id="message"></p>
            <p id="errorMessage" class="error-message"></p>
            <input type="text" id="input">
            <!-- Add checkbox containers -->
            <div class="checkbox-container" id="shortsCheckbox">
                <input type="checkbox" id="isShorts">
                <label for="isShorts">This is a YouTube Shorts video</label>
            </div>
            <div class="checkbox-container" id="channelTypeCheckbox">
                <input type="checkbox" id="isChannelName">
                <label for="isChannelName">This is a channel name (not a username)</label>
            </div>
            <div class="button-row">
                <button onclick="submit()">OK</button>
                <button class="secondary" onclick="cancel()">Cancel</button>
            </div>
        </div>
    </div>
    <script>
		const { ipcRenderer } = require('electron');
		var classic = true;
		var showChannelType = false;

		ipcRenderer.on('prompt-data', (event, data) => {
			if (!data.message && data.title && data.title.includes('\n')) {
				let tmp = data.title.split('\n');
				data.title = tmp.shift();
				data.message = tmp.join('\n');
			}
			const titleElement = document.getElementById('title');
			titleElement.textContent = data.title;
			titleElement.innerHTML = titleElement.innerHTML.replace(/\n/g, '<br>');
			const messageElement = document.getElementById('message');
			messageElement.textContent = data.message;
			messageElement.innerHTML = messageElement.innerHTML.replace(/\n/g, '<br>');
			const errorElement = document.getElementById('errorMessage');
			const inputElement = document.getElementById('input');
			if (inputElement) {
				inputElement.value = (typeof data.value === 'string') ? data.value : '';
				setTimeout(() => {
					inputElement.focus();
					inputElement.select();
				}, 0);
			}

			if (errorElement) {
				if (data.errorMessage) {
					errorElement.style.display = 'block';
					errorElement.textContent = data.errorMessage;
					inputElement?.classList.add('error');
				} else {
					errorElement.style.display = 'none';
					errorElement.textContent = '';
					inputElement?.classList.remove('error');
				}
			}
			
			//classic = true; // useful for debugging.
			//showChannelType = false;
			
			// Set flags based on data
			if (data.showShortsCheckbox || data.showChannelTypeCheckbox) {
				classic = false;
			} else {
				classic = true;
			}
			
			const shortsContainer = document.getElementById('shortsCheckbox');
			if (data.showShortsCheckbox) {
				shortsContainer.style.display = 'block';
				const shortsCheckbox = document.getElementById('isShorts');
				if (shortsCheckbox) {
					shortsCheckbox.checked = !!data.defaultIsShorts;
				}
			}
			else {
				shortsContainer.style.display = 'none';
				const shortsCheckbox = document.getElementById('isShorts');
				if (shortsCheckbox) {
					shortsCheckbox.checked = false;
				}
			}

			const channelContainer = document.getElementById('channelTypeCheckbox');
			if (data.showChannelTypeCheckbox) {
				showChannelType = true;
				channelContainer.style.display = 'block';
				const channelCheckbox = document.getElementById('isChannelName');
				if (channelCheckbox) {
					channelCheckbox.checked = !!data.defaultIsChannelName;
				}
			} else {
				channelContainer.style.display = 'none';
				const channelCheckbox = document.getElementById('isChannelName');
				if (channelCheckbox) {
					channelCheckbox.checked = false;
				}
			}
		});

		const inputElement = document.getElementById('input');
		if (inputElement) {
			inputElement.addEventListener('input', () => {
				const errorElement = document.getElementById('errorMessage');
				if (!inputElement.value.trim()) {
					return;
				}
				if (errorElement && errorElement.style.display === 'block') {
					errorElement.style.display = 'none';
					errorElement.textContent = '';
					inputElement.classList.remove('error');
				}
			});
		}

        function submit() {
             const inputValue = document.getElementById('input').value;
    
			// If classic mode, just return the string
			if (classic) {
				ipcRenderer.send('prompt-response', inputValue);
				return;
			}
			
			// Otherwise create a response object with all relevant properties
			const response = {
				value: inputValue
			};
			
			// Add checkbox states if the checkboxes are visible
			if (document.getElementById('shortsCheckbox').style.display !== 'none') {
				response.isShorts = document.getElementById('isShorts').checked;
			}
			
			if (document.getElementById('channelTypeCheckbox').style.display !== 'none') {
				response.isChannelName = document.getElementById('isChannelName').checked;
			}
			
			ipcRenderer.send('prompt-response', response);
		}

        function cancel() {
            ipcRenderer.send('prompt-response', null);
            window.close();
        }
        
        document.getElementById('input').addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                submit();
            } else if (event.key === 'Escape') {
                cancel();
            }
        });
    </script>
</body>
</html>
