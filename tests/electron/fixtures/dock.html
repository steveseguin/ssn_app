<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Window State Diagnostic Dock</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f1720;
      color: #f7fafc;
      font-family: sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .panel {
      width: min(80vw, 640px);
      padding: 24px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.28);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Dock Window Diagnostic</h1>
    <p>This local fixture exists only to test SSAPP window size and position restore logic.</p>
  </div>
</body>
</html>
